[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etrigan"
version = "0.1.0"
description = "Sovereign On-Premise Agentic AI Workbench"
authors = [
    {name = "HellblazerVersus"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0",
    "pytest>=7.0"
]

[project.scripts]
etrigan = "etrigan_cli:app"
